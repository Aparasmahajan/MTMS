# MTMS behind nginx, with HTTPS.
#
#   sudo cp deploy/nginx/mtms.conf /etc/nginx/sites-available/mtms
#   sudo ln -s /etc/nginx/sites-available/mtms /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# It forwards to 6010 ONLY. The API stays on loopback (SERVER_ADDRESS=127.0.0.1 in api.env)
# and is never reachable from outside — the web app proxies /api/v1/... to it server-side,
# which is what makes one open port enough.
#
# Nothing needs rebuilding to put the app on a domain. The public address was never compiled
# into the frontend; only the private hop to the API was. Three settings change in api.env:
#
#   MTMS_APP_BASE_URL="https://mtms.azalio.io"
#   MTMS_CORS_ALLOWED_ORIGINS="https://mtms.azalio.io"
#   MTMS_SECURE_COOKIES=true        <- only once TLS below actually serves
#
# The order on that last one matters in both directions. Too early and login fails SILENTLY:
# the browser takes the response, drops the cookie and returns to the sign-in page with
# nothing logged anywhere. Too late and the session cookie travels in the clear.

server {
    listen 80;
    listen [::]:80;
    server_name mtms.azalio.io;

    # Leave this reachable over plain HTTP — certbot renews through it, and a redirect that
    # catches it is the usual reason a renewal fails silently three months later.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mtms.azalio.io;

    ssl_certificate     /etc/letsencrypt/live/mtms.azalio.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtms.azalio.io/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS. Worth knowing before enabling: a browser that has seen this will refuse plain HTTP
    # to this host for a year and there is no way to call it back. Turn it on once the
    # certificate renews reliably, not on the first day.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # The whole app is a projection of a few hundred rows; nothing here is large.
    client_max_body_size 8m;

    access_log /var/log/nginx/mtms.access.log;
    error_log  /var/log/nginx/mtms.error.log;

    location / {
        proxy_pass http://127.0.0.1:6010;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # This is the one that gets forgotten, and the failure is confusing rather than loud.
        # The API reads it — see `forward-headers-strategy: framework` in application.yml —
        # and without it Spring believes every request arrived over plain HTTP and writes
        # http:// into anything it generates from behind your HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Next.js needs these for its dev-time and streaming connections; harmless in
        # production and one less thing to debug if you ever run the dev server behind this.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A cell click is one round trip that writes, bumps a revision and re-projects the
        # whole project. Comfortable, and still short enough that a genuinely hung request
        # fails rather than holding a worker open.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Hashed filenames, so they can be cached hard and for a long time. The bundle name
    # changes on every build, which is what makes this safe.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Deliberately NOT proxied to the API directly.
    #
    # It would work, and it would quietly undo the reason there is one open port: a second
    # public route to the API means CORS starts mattering again, the cookie becomes
    # cross-origin, and the loopback binding in api.env stops being the boundary it looks
    # like. The web app already forwards /api/v1/... server-side. Leave it to do that.
    #
    # location /api/ { proxy_pass http://127.0.0.1:6011; }   # <- don't

    # Health checks for a load balancer. Both are on the web app's own origin.
    location = /login {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host $host;
        access_log off;
    }
}
