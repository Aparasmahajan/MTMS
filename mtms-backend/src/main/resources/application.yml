# MTMS API — default configuration.
#
# The defaults here run the service with no MySQL, no Redis and no Kafka: storage is
# in-memory, the cache is a local map, and events are logged. That is deliberate, and it is
# the same choice lib/server/store.ts makes with its file driver — a developer should be able
# to clone this and start the service without installing three daemons first.
#
# It starts empty. The demo seeder was removed once the real database was populated, so there
# is no longer anything that creates an organisation or a first account on start-up — see the
# note in DEPLOYMENT.md before pointing this at a fresh database.
#
# Everything real is one profile away. See application-mysql.yml.

server:
  port: ${SERVER_PORT:6011}
  shutdown: graceful
  # Behind a load balancer the client address and scheme arrive in headers; without this,
  # generated links and rate-limit keys would all refer to the proxy.
  forward-headers-strategy: framework

spring:
  application:
    name: mtms-api

  # Spring's own mail settings, wired from the mtms.mail.* block below so there is one place to
  # configure mail rather than two that have to agree. Blank host is harmless: the autoconfigured
  # sender is built either way, and SmtpMailer — the only thing that uses it — does not exist
  # unless mtms.mail.host is set.
  mail:
    host: ${MTMS_MAIL_HOST:}
    port: ${MTMS_MAIL_PORT:587}
    username: ${MTMS_MAIL_USERNAME:}
    password: ${MTMS_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MTMS_MAIL_STARTTLS:true}
          # Without these two, a relay that is simply not there hangs the request that triggered
          # the send. Ten seconds is long enough for a slow relay and short enough that nobody
          # watches a spinner wondering whether the invitation was created.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  lifecycle:
    # Finish in-flight requests before the process exits, so a rolling deploy does not
    # answer a click with a connection reset.
    timeout-per-shutdown-phase: 20s

  jackson:
    # The wire is snake_case, matching the TypeScript service exactly. Set once here rather
    # than annotated onto two hundred record components.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # No database, cache or broker in the default profile. Excluding the autoconfiguration is
  # what keeps startup from failing on a missing datasource URL rather than falling back.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

mtms:
  # memory | postgres
  storage: memory
  # Seed the demo organisation when the store has no tenants yet. Off by default in the
  # mysql profile (application-mysql.yml) — see DEPLOYMENT.md, "A fresh database has no
  # way in".
  seed-on-empty-database: true
  # memory | redis
  cache:
    type: memory
  events:
    # logging | kafka
    publisher: logging
    topic: mtms.domain-events
    drain-interval-ms: 5000

  notifications:
    # A Teams or Slack incoming webhook. Unset — and unset is the default — the in-app inbox is
    # the only channel, which is a complete one: every notification is written there before any
    # transport is attempted.
    #
    # Email is deliberately not here. It was the obvious first choice and is not buildable on
    # this machine: the mail library is not in the offline Maven repository and the network
    # refuses the registry. It is one class and one dependency away — see Notifier.
    # webhook-url: https://outlook.office.com/webhook/...

  ticket-base-url: https://tms.internal/browse
  app-base-url: http://localhost:3000

  # Email for invitations and password resets.
  #
  # Unset — and unset is the default — those links are written to the log and shown on the screen
  # that created them, for an administrator to pass on by hand. That works, and it is why links
  # kept getting lost: nothing arrives unless a person relays it.
  #
  # Set `host` and SmtpMailer takes over. The other SMTP settings are Spring's own
  # (spring.mail.*) and are wired from these below, so there is one place to configure mail
  # rather than two that have to agree.
  #
  #   MTMS_MAIL_HOST=smtp.example.com
  #   MTMS_MAIL_PORT=587
  #   MTMS_MAIL_USERNAME=mtms@example.com
  #   MTMS_MAIL_PASSWORD=...          <- the server's environment file only, never the repository
  #   MTMS_MAIL_FROM=mtms@example.com
  #   MTMS_MAIL_STARTTLS=true
  mail:
    host: ${MTMS_MAIL_HOST:}
    port: ${MTMS_MAIL_PORT:587}
    username: ${MTMS_MAIL_USERNAME:}
    password: ${MTMS_MAIL_PASSWORD:}
    # The address recipients see. Blank means "use the username", which is what most relays
    # require the envelope sender to be anyway.
    from: ${MTMS_MAIL_FROM:}
    starttls: ${MTMS_MAIL_STARTTLS:true}

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001

  security:
    # Development only, and long enough to satisfy the length check in SecurityProperties.
    # In any real deployment this comes from the environment: MTMS_SECURITY_JWT_SECRET.
    jwt-secret: ${MTMS_SECURITY_JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
    access-token-lifetime: 15m
    refresh-token-lifetime: 30d
    secure-cookies: false
    write-rate-limit-per-minute: 300

# Writes only, per user — the same shape as the TypeScript limiter. Reads are not limited:
# the projection is cached and a user hammering refresh is not the threat model.
resilience4j:
  ratelimiter:
    instances:
      writes:
        limit-for-period: 300
        limit-refresh-period: 60s
        timeout-duration: 0s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    # The mail relay is NOT part of this service's health, and switching it on by configuring
    # a mail host once took the whole API "down" while it was serving every request correctly.
    #
    # Spring Boot registers a MailHealthIndicator the moment spring.mail.host is set, and it
    # opens a real SMTP connection on every /actuator/health call. A relay that refuses
    # authentication therefore turned the aggregate status to DOWN, /actuator/health to 503,
    # and — because nginx and the deploy script both read that endpoint — made a working
    # deployment look like a failed one.
    #
    # That is the opposite of how mail is treated everywhere else here: every send is wrapped,
    # its failure swallowed and reported, and the caller told what happened, precisely so that
    # an unreachable relay degrades one feature instead of taking the service with it. A health
    # indicator that overrides that is the tail wagging the dog.
    #
    # It also costs an SMTP handshake per health poll, against a relay that rate-limits them.
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  metrics:
    tags:
      application: mtms-api

logging:
  level:
    io.mtms: INFO
    org.springframework.jdbc.core: INFO
  pattern:
    # The correlation id is what makes one user's click followable across instances.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-—}] %logger{28} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
